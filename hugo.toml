baseURL = 'https://samuelq.dev/'
locale = 'en-CA'
title = 'Samuel Q'

pluralizelisttitles = false
disableKinds = ["RSS"]
enableRobotsTXT = true

[params]
  description = 'Personal site of Samuel Q.'
  themeColor = '#24283b'

[taxonomies]
  tag = "tags"
  category = "categories"

[security]
  allowContent = ['^text/(html|markdown)$']

[markup]
  [markup.highlight]
    # Classes, not inline styles: the theme rides the cached stylesheet instead of being re-sent
    # on every token. assets/css/chroma.css holds the generated rules and the command for them.
    noClasses = false
    lineNos = true

[[menu.main]]
  name = 'Projects'
  pageRef = '/projects'
  weight = 10

[[menu.main]]
  name = 'Blog'
  pageRef = '/blog'
  weight = 20
