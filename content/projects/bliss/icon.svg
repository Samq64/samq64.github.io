<!--
  The app icon: the board's pair of eyes on the Tokyo Night Storm background the site's
  theme-color already uses. Scaled straight off the pad, whose eyes are 26 by 19 with a
  pupil radius of 8, and gazing level the way they rest before a key is pressed.

  Android hands a maskable icon to its adaptive icon system, which only guarantees the middle
  two thirds — a radius of 171 here, not the 205 a circle of 80% would give. The outer edges
  stop at 156 to stay clear of it, which is what a circular launcher crops to.

  icon.png is rasterised from this and committed, since the build has no rasteriser.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#24283b" />
  <g fill="#e1e2e7">
    <ellipse cx="175" cy="256" rx="75" ry="55" />
    <ellipse cx="337" cy="256" rx="75" ry="55" />
  </g>
  <g fill="#343b58">
    <circle cx="175" cy="256" r="23" />
    <circle cx="337" cy="256" r="23" />
  </g>
</svg>
