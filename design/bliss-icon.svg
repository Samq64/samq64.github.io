<!--
  Scaled off the pad, whose eyes are 26 by 19 with a pupil radius of 8,
  and framed to be shown whole, so they run out to 195 of the 256 available.
  The maskable variant is grown from this — see the pwa partial.

  The PNG is committed. After editing:
    rsvg-convert -w 512 -h 512 design/bliss-icon.svg -o assets/projects/bliss/icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#24283b" />
  <g fill="#e1e2e7">
    <ellipse cx="155" cy="256" rx="94" ry="69" />
    <ellipse cx="357" cy="256" rx="94" ry="69" />
  </g>
  <g fill="#343b58">
    <circle cx="155" cy="256" r="29" />
    <circle cx="357" cy="256" r="29" />
  </g>
</svg>
