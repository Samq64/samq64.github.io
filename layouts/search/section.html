{{ define "header" }}
  <h1>{{ .Title }}</h1>
  {{/*
    Posting to this same page keeps Enter meaningful before the script has loaded, and the
    markup alone takes the focus, so a slow index never costs the first keystrokes.
  */}}
  <form action="{{ .RelPermalink }}" role="search" class="search-bar">
    <label for="search-input" class="visually-hidden">Search</label>
    <input
      type="search"
      id="search-input"
      name="q"
      placeholder="Type to search"
      autocomplete="off"
      autofocus
    />
  </form>
  <p id="search-status"></p>
{{ end }}

{{ define "main" }}
  <noscript>
    <p class="callout red">This page needs JavaScript to search.</p>
  </noscript>

  <hr />
  <ul class="cards" id="search-results"></ul>

  <template id="card-template">
    {{ partial "card" (dict "url" "" "title" "" "date" "-" "datetime" "" "description" "") }}
  </template>

  <script type="module">
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");
    const template = document.getElementById("card-template");
    const input = document.getElementById("search-input");

    status.textContent = "Loading…";
    /* Only when the field is still untouched, so keystrokes taken during the load survive. */
    if (!input.value) input.value = new URLSearchParams(location.search).get("q") ?? "";

    let pagefind;
    try {
      pagefind = await import("{{ "pagefind/pagefind.js" | relURL }}");
      await pagefind.init();
    } catch (error) {
      console.error("Failed to load the search index:", error);
      status.textContent = "Search is unavailable.";
    }

    /*
      Pagefind returns the excerpt as unescaped page text with matches in <mark>. Splitting on
      those gives alternating plain and matched segments, so nothing is parsed as markup and a
      page that shows a tag as code still displays it.
    */
    function excerptNodes(excerpt) {
      return excerpt.split(/<mark>|<\/mark>/).map((part, index) => {
        if (index % 2 === 0) return part;
        const mark = document.createElement("mark");
        mark.textContent = part;
        return mark;
      });
    }

    function renderResult({ url, meta, excerpt }) {
      const card = template.content.cloneNode(true);
      const link = card.querySelector(".card-link");
      link.href = url;
      link.textContent = meta.title;

      const date = card.querySelector(".card-date");
      if (meta.date) {
        date.textContent = meta.date;
        date.dateTime = meta.datetime ?? "";
      } else {
        date.remove();
      }

      card.querySelector(".card-description").replaceChildren(...excerptNodes(excerpt));
      return card;
    }

    let latest = 0;

    async function runSearch(query) {
      const id = ++latest;
      history.replaceState(null, "", query ? `?q=${encodeURIComponent(query)}` : location.pathname);

      if (!query) {
        results.replaceChildren();
        status.textContent = "";
        return;
      }

      const search = await pagefind.debouncedSearch(query, {}, 200);
      if (search === null) return;

      const data = await Promise.all(search.results.map((result) => result.data()));
      if (id !== latest) return;

      results.replaceChildren(...data.map(renderResult));
      const count = data.length;
      status.textContent = count
        ? `${count} result${count === 1 ? "" : "s"} for "${query}"`
        : `No results for "${query}"`;
    }

    if (pagefind) {
      input.addEventListener("input", () => runSearch(input.value.trim()));
      input.form.addEventListener("submit", (event) => {
        event.preventDefault();
        runSearch(input.value.trim());
      });
      runSearch(input.value.trim());
    }
  </script>
{{ end }}
