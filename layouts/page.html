{{ define "header" }}
  <h1>{{ .Title }}</h1>
  {{ if .Date }}
    <p data-pagefind-meta="date" data-pagefind-ignore>{{ .Date | time.Format ":date_medium" }}</p>
  {{ end }}
  {{ partial "tags" . }}
{{ end }}

{{ define "main" }}
  <hr />
  {{ if .Content }}
    <article>
      {{- .Content -}}
    </article>
  {{ else }}
    <p class="no-content">(No content)</p>
  {{ end }}
{{ end }}
