{{ define "header" }}
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}
    <p>
      <time
        datetime="{{ .Date.Format "2006-01-02" }}"
        data-pagefind-meta="date, datetime[datetime]"
        data-pagefind-ignore
      >
        {{- .Date | time.Format ":date_long" -}}
      </time>
    </p>
  {{ end }}
  {{ partial "tags" (dict "page" . "taxonomies" (slice "tags")) }}
{{ end }}
