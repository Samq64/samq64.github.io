<li>
  <article class="card hover-lift">
    <a href="{{ .url }}" class="card-link">
      <h2>{{ .title }}</h2>
      {{ with .date }}
        <span>{{ . }}</span>
      {{ end }}
      <p>{{ .description }}</p>
    </a>
    {{ with .page }}
      {{ partial "tags" . }}
    {{ end }}
  </article>
</li>
