<li>
  <article class="card blue hover-lift">
    <a href="{{ .url }}" class="card-link">
      <h2>{{ .title }}</h2>
      <span class="card-date">{{ .date }}</span>
      <p>{{ .description }}</p>
    </a>
    {{ with .page }}
      {{ partial "tags" (dict "page" . "taxonomies" (slice "tags" "categories")) }}
    {{ end }}
  </article>
</li>
