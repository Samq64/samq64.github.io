<li class="card hover-lift">
  <h2><a href="{{ .url }}" class="card-link">{{ .title }}</a></h2>
  <div>
    {{ with .date }}
      <time class="card-date" datetime="{{ $.datetime }}">{{ . }}</time>
    {{ end }}
    <p class="card-description">{{ .description }}</p>
    {{ with .page }}
      {{ partial "tags" (dict "page" . "taxonomies" (slice "tags" "categories")) }}
    {{ end }}
  </div>
</li>
