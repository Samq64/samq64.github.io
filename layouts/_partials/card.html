{{- /* The link wraps the title alone; card.css stretches it and lifts the tags back over. */ -}}
<li>
  <article class="card blue hover-lift">
    <h2><a href="{{ .url }}" class="card-link">{{ .title }}</a></h2>
    {{ with .date }}
      <time class="card-date" datetime="{{ $.datetime }}">{{ . }}</time>
    {{ end }}
    <p>{{ .description }}</p>
    {{ with .page }}
      {{ partial "tags" (dict "page" . "taxonomies" (slice "tags" "categories")) }}
    {{ end }}
  </article>
</li>
