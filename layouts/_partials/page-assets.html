{{- /* In the layouts, not head: these have to land after the site stylesheet to override it. */ -}}
{{- $built := partialCached "built-assets" . .Path -}}
{{- range $built.styles }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" />
{{- end }}
{{- range $built.scripts }}
  <script defer src="{{ .RelPermalink }}"></script>
{{- end }}
