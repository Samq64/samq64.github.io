{{- $iconPath := printf "img/icons/%s.svg" .icon -}}

{{- with resources.Get $iconPath -}}
  <span class="svg-icon{{ with $.class }} {{ . }}{{ end }}"
    {{- with $.name }} role="img" title="{{ . }}" aria-label="{{ . }}"
    {{- else }} aria-hidden="true"
    {{- end }}>
    {{- .Content | safeHTML -}}
  </span>
{{- else -}}
  {{ errorf "Icon not found: %s" $iconPath }}
{{- end -}}
