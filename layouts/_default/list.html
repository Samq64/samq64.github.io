{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content -}}
  <hr />
  <ul class="cards">
    {{ range .Pages -}}
      <li>
        <article>
          <a href="{{ .RelPermalink }}" class="card hover-lift">
            <h2>{{ .LinkTitle }}</h2>
            {{ if .Date }}
              <span>{{ .Date | time.Format ":date_medium" }}</span>
            {{ end }}
            <p>{{ .Description }}</p>
          </a>
        </article>
      </li>
    {{- end }}
  </ul>
{{ end }}
