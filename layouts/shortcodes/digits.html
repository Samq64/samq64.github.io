{{- $count := int (.Get 0) -}}
<div class="digits" role="group" aria-label="{{ $count }} digit code">
  {{- range $i := seq $count }}
    <input
      type="text"
      inputmode="numeric"
      class="digit"
      aria-label="Digit {{ $i }} of {{ $count }}"
      placeholder="-"
      autocomplete="off"
    />
  {{- end }}
</div>
